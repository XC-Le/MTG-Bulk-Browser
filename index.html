<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bulk Bin Finder</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#dcdcd4;--ac:#2f6f4f;--ac2:#e8f2ec;--warn:#9a5b00}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecece6;--mut:#9a9a92;--card:#201f1d;--bd:#3a3935;--ac:#6fcf97;--ac2:#22332a;--warn:#e0a84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:320px 1fr}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 8px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
textarea,input[type=search]{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit}
textarea{height:180px;font-family:ui-monospace,monospace;font-size:13px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mut{color:var(--mut);font-size:13px}
.sets{max-height:340px;overflow:auto;margin-top:8px}
.sets label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.sets .n{margin-left:auto;color:var(--mut)}
.grp{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:var(--card);overflow:hidden}
.grp>header{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;background:var(--ac2)}
.grp>header b{font-size:15px}
.item{display:flex;gap:8px;align-items:flex-start;padding:6px 12px;border-top:1px solid var(--bd)}
.item .nm{flex:1}
.item .alt{font-size:12px;color:var(--mut)}
.pr{font-size:12px;color:var(--mut);white-space:nowrap}
.found .nm{text-decoration:line-through;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.warn{color:var(--warn)}
.hv{cursor:help}
.si{width:18px;height:18px;vertical-align:-3px;margin-right:6px;flex:none}
.sets .si{margin-right:0}
@media(prefers-color-scheme:dark){.si{filter:invert(1)}}
#tip{position:fixed;display:none;width:250px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;z-index:50;background:var(--card)}
</style></head><body>
<div class="wrap">
<aside>
  <h1>Bulk Bin Finder</h1>
  <div class="panel">
    <h2>Deck list</h2>
    <textarea id="deck" placeholder="1 Sol Ring&#10;4 Lightning Bolt&#10;1x Counterspell (CMM) 81"></textarea>
    <div class="row"><button id="go">Look up cards</button><span class="mut" id="status"></span></div>
    <div class="row"><label class="mut">Bulk threshold $<input id="thr" type="number" step="0.05" value="1.00" style="width:70px"></label></div>
  </div>
  <div class="panel">
    <h2>Sets in the store’s bins</h2>
    <div class="mut">Untick sets the store doesn’t have. Counts show how many of your remaining bulk cards each set has.</div>
    <input type="search" id="sq" placeholder="Filter sets…" style="margin-top:8px">
    <div class="row"><button class="sec" id="all">Enable shown</button><button class="sec" id="none">Disable shown</button></div>
    <div class="sets" id="sets"></div>
  </div>
  <button class="sec" id="reset">Clear everything</button>
</aside>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="out"><p class="mut">Paste a deck list and press “Look up cards”. Needs internet access to Scryfall.</p></div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
let S={list:[],cards:{},found:{},excl:{},thr:1,deck:''};
let tab='plan',sq='',visSets=[];
try{const s=localStorage.getItem('bbf');if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem('bbf',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon=c=>{const u=S.icons&&S.icons[c];return u?`<img class="si" src="${esc(u)}" alt="" onerror="this.style.display='none'">`:''};
async function loadIcons(){
  if(S.icons&&Object.keys(S.icons).length)return;
  try{
    const r=await fetch('https://api.scryfall.com/sets');
    if(!r.ok)return;
    const j=await r.json(),m={};
    for(const s of j.data)if(s.icon_svg_uri)m[s.code]=s.icon_svg_uri;
    S.icons=m;save();render();
  }catch(e){}
}
const BASICS=/^(plains|island|swamp|mountain|forest|wastes|snow-covered (plains|island|swamp|mountain|forest))$/i;
const HEAD=/^(deck|sideboard|commander|companion|maybeboard|mainboard|about)\b/i;

function parse(t){
  const seen=new Set(),out=[];
  for(let l of t.split('\n')){
    l=l.trim();
    if(!l||l.startsWith('//')||l.startsWith('#'))continue;
    const m=l.match(/^(\d+)\s*x?\s+(.+)$/i);
    let name=m?m[2]:l;
    if(!m&&HEAD.test(name))continue;
    name=name.replace(/\s+\([A-Za-z0-9]{2,6}\)(\s+\S+)?\s*(\*[FE]\*)?$/,'').replace(/\s+\*[FE]\*$/,'').trim();
    if(!name||BASICS.test(name)||seen.has(name))continue;
    seen.add(name);out.push(name);
  }
  return out;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function lookup(name){
  let url='https://api.scryfall.com/cards/search?unique=prints&order=released&q='+encodeURIComponent('!"'+name+'" game:paper');
  const prints=[];
  while(url){
    const r=await fetch(url);
    if(r.status===404)return{ok:false};
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    for(const c of j.data){
      const p=parseFloat(c.prices&&c.prices.usd);
      if(!isNaN(p))prints.push({s:c.set,n:c.set_name,p});
    }
    url=j.has_more?j.next_page:null;
    if(url)await sleep(100);
  }
  const prices=prints.map(x=>x.p);
  const sets={};
  for(const x of prints){if(!sets[x.s]||x.p<sets[x.s].p)sets[x.s]={n:x.n,p:x.p}}
  return{ok:true,min:prices.length?Math.min(...prices):null,sets};
}
$('go').onclick=async()=>{
  S.deck=$('deck').value;S.thr=parseFloat($('thr').value)||1;
  S.list=parse(S.deck);save();
  const todo=S.list.filter(n=>!S.cards[n]);
  let i=0;
  try{
    for(const n of todo){
      $('status').textContent=`Looking up ${++i}/${todo.length}…`;
      S.cards[n]=await lookup(n);save();render();
      await sleep(100);
    }
    $('status').textContent='Done.';
  }catch(e){$('status').textContent='Lookup failed: '+e.message+' (open this file locally, not in a sandbox)'}
  render();
};
const isBulk=c=>c&&c.ok&&c.min!==null&&Object.values(c.sets).some(x=>x.p<S.thr);
const cSets=c=>Object.entries(c.sets).filter(([k,v])=>v.p<S.thr);

function compute(){
  const rem=[],notBulk=[],missing=[],found=[];
  for(const n of S.list){
    const c=S.cards[n];if(!c)continue;
    if(S.found[n]){found.push(n);continue}
    if(!c.ok)missing.push(n);else if(!isBulk(c))notBulk.push(n);else rem.push(n);
  }
  const cand={};
  for(const n of rem)cand[n]=cSets(S.cards[n]).filter(([k])=>!S.excl[k]).map(([k])=>k);
  const unc=new Set(rem.filter(n=>cand[n].length));
  const plan=[];
  while(unc.size){
    const cnt={};
    for(const n of unc)for(const k of cand[n])cnt[k]=(cnt[k]||0)+1;
    const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b))[0];
    const cards=[...unc].filter(n=>cand[n].includes(best));
    cards.forEach(n=>unc.delete(n));
    plan.push({code:best,cards});
  }
  const noSet=rem.filter(n=>!cand[n].length);
  return{rem,notBulk,missing,found,cand,plan,noSet};
}
function setName(code){for(const n of S.list){const c=S.cards[n];if(c&&c.sets&&c.sets[code])return c.sets[code].n}return code}
function priceIn(n,code){const x=S.cards[n].sets[code];return x?'$'+x.p.toFixed(2):''}
function row(n,code,d){
  const alts=d.cand[n]?d.cand[n].filter(k=>k!==code).slice(0,6).map(k=>k.toUpperCase()).join(', '):'';
  const f=S.found[n];
  return `<div class="item ${f?'found':''}"><input type="checkbox" data-f="${esc(n)}" ${f?'checked':''}>
  <div class="nm hv" data-n="${esc(n)}">${esc(n)}${alts&&!f?`<div class="alt">Also in: ${alts}</div>`:''}</div>
  <span class="pr">${code?priceIn(n,code):'min $'+(S.cards[n].min??'?')}</span></div>`;
}
function render(){
  $('deck').value=S.deck;$('thr').value=S.thr;
  const d=compute();
  // set filter
  const cnt={};
  for(const n of d.rem)for(const [k,v] of cSets(S.cards[n]))(cnt[k]=cnt[k]||{n:v.n,c:0}).c++;
  const q=sq.toLowerCase();
  const shown=Object.entries(cnt).sort((a,b)=>b[1].c-a[1].c)
    .filter(([k,v])=>!q||k.includes(q)||v.n.toLowerCase().includes(q));
  visSets=shown.map(x=>x[0]);
  $('sets').innerHTML=shown
    .map(([k,v])=>`<label><input type="checkbox" data-s="${k}" ${S.excl[k]?'':'checked'}>${icon(k)}${esc(v.n)} <span class="mut">(${k.toUpperCase()})</span><span class="n">${v.c}</span></label>`).join('')
    ||'<span class="mut">No sets yet.</span>';
  // tabs
  const tabs=[['plan','Shopping plan ('+d.rem.length+' left)'],['found','Found ('+d.found.length+')'],['other','Not bulk / missing ('+(d.notBulk.length+d.missing.length)+')']];
  $('tabs').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  let h='';
  if(!S.list.length){$('out').innerHTML='<p class="mut">Paste a deck list and press “Look up cards”. Needs internet access to Scryfall.</p>';return}
  if(tab==='plan'){
    if(!d.rem.length)h+='<p class="mut">Nothing left to find. 🎉</p>';
    h+=d.plan.map(g=>`<div class="grp"><header><b>${icon(g.code)}${esc(setName(g.code))} <span class="mut">(${g.code.toUpperCase()})</span></b><span class="mut">${g.cards.length} card${g.cards.length>1?'s':''}</span></header>${g.cards.map(n=>row(n,g.code,d)).join('')}</div>`).join('');
    if(d.noSet.length)h+=`<div class="grp"><header><b class="warn">No enabled set has these as bulk</b><span class="mut">${d.noSet.length}</span></header>${d.noSet.map(n=>row(n,'',d)).join('')}</div>`;
    if(d.plan.length)h+='<p class="mut">Sets are ordered greedily: the first box covers the most cards, the next covers the most of what’s still left, and so on.</p>';
  }else if(tab==='found'){
    h=d.found.length?`<div class="grp">${d.found.map(n=>row(n,'',d)).join('')}</div>`:'<p class="mut">Nothing found yet. Untick a card to move it back.</p>';
  }else{
    h+=`<div class="grp"><header><b>Over $${S.thr.toFixed(2)} in every printing</b><span class="mut">${d.notBulk.length}</span></header>${d.notBulk.map(n=>`<div class="item"><div class="nm hv" data-n="${esc(n)}">${esc(n)}</div><span class="pr">from $${S.cards[n].min??'?'}</span></div>`).join('')}</div>`;
    if(d.missing.length)h+=`<div class="grp"><header><b class="warn">Not found on Scryfall</b><span class="mut">${d.missing.length}</span></header>${d.missing.map(n=>`<div class="item"><div class="nm">${esc(n)}</div></div>`).join('')}</div>`;
  }
  $('out').innerHTML=h;
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){if(t.checked)S.found[t.dataset.f]=1;else delete S.found[t.dataset.f];save();render()}
  if(t.dataset.s){if(t.checked)delete S.excl[t.dataset.s];else S.excl[t.dataset.s]=1;save();render()}
});
document.addEventListener('click',e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}});
const tip=document.createElement('img');tip.id='tip';document.body.appendChild(tip);
document.addEventListener('mouseover',e=>{
  const h=e.target.closest&&e.target.closest('.hv');
  if(!h){tip.style.display='none';return}
  if(tip.dataset.n!==h.dataset.n){
    tip.dataset.n=h.dataset.n;
    tip.src='https://api.scryfall.com/cards/named?exact='+encodeURIComponent(h.dataset.n)+'&format=image&version=normal';
  }
  tip.style.display='block';
});
document.addEventListener('mousemove',e=>{
  if(tip.style.display!=='block')return;
  let x=e.clientX+18;if(x+266>innerWidth)x=e.clientX-268;
  const y=Math.min(Math.max(8,e.clientY-175),innerHeight-358);
  tip.style.left=x+'px';tip.style.top=y+'px';
});
$('sq').oninput=e=>{sq=e.target.value;render()};
$('all').onclick=()=>{visSets.forEach(k=>delete S.excl[k]);save();render()};
$('none').onclick=()=>{visSets.forEach(k=>S.excl[k]=1);save();render()};
$('reset').onclick=()=>{if(confirm('Clear deck, found marks and set choices?')){S={list:[],cards:{},found:{},excl:{},thr:1,deck:''};save();render()}};
render();loadIcons();
</script></body></html>
